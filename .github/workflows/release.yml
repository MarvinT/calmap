name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Verify release tag
        shell: bash
        run: |
          PACKAGE_VERSION=$(python -c "import ast; print(ast.literal_eval([line.split('=', 1)[1].strip() for line in open('calmap/__init__.py') if line.startswith('__version__ =')][0]))")
          test "${{ github.event.release.tag_name }}" = "v${PACKAGE_VERSION}"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/calmap/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
