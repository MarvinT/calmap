[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "calmap"
dynamic = ["version"]
description = "Calendar heatmaps from pandas time series data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.rst"]
authors = [
  {name = "Marvin Thielk", email = "marvin.thielk@gmail.com"},
  {name = "Martijn Vermaat", email = "martijn@vermaat.name"},
]
maintainers = [
  {name = "Marvin Thielk", email = "marvin.thielk@gmail.com"},
]
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "python-dateutil",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]
docs = [
  "numpydoc",
  "sphinx>=7",
]

[project.urls]
Homepage = "https://github.com/MarvinT/calmap"
Documentation = "https://github.com/MarvinT/calmap#usage"
Issues = "https://github.com/MarvinT/calmap/issues"
Source = "https://github.com/MarvinT/calmap"

[tool.setuptools.dynamic]
version = {attr = "calmap.__version__"}

[tool.setuptools]
packages = ["calmap"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
